name: Discord Countdown Reminder

on:
  schedule:
    # 9am Eastern during standard time (UTC-5)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  ping-countdown-endpoint:
    runs-on: ubuntu-latest
    environment: production
    env:
      PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger countdown webhook
        run: |
          curl -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${PROD_BASE_URL}/api/cron/discord-countdown"
